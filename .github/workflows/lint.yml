name: Auto Linter

on:
  push: 
    paths: "*.py"

jobs:
  code-linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7
        
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14
      # this step will intall the linter
      - name: Install Linter
        run: pip install ruff

      # this step will be run linter
      - name: check the files for linting
        run: ruff check .
